<li class="event rounded-md p-4 flex flex-row justify-between items-center">
	<div>
		<span class="block text-xl">{{ event.title }}</span>
		<div class="font-display text-xl">
			<span class="inline-flex flex-row items-baseline gap-1"
				><span class="hero-map-pin size-4 pin"></span>{{ event.location }}</span
			>
			{% if event.booth_number %}
				<span class="uppercase">• Booth</span>
				<span class="uppercase">{{ event.booth_number }}</span>
			{% endif %}
		</div>
	</div>
	<div class="rounded-sm flex flex-col font-display items-center">
		<span
			class="bg-current text-xl w-full uppercase pt-1.5 pb-1 px-4 flex flex-col items-center justify-center rounded-t-sm"
		>
			<span class="block leading-[0.7] month"
				>{{ event.date|date:"M" }}</span
			></span
		>
		<span
			class="border border-current w-full flex flex-col items-center justify-center rounded-b-sm"
		>
			<span class="text-3xl">{{ event.date|date:"d" }}</span>
		</span>
	</div>
</li>
